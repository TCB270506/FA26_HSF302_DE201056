<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh sách sinh viên</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people-fill me-2"></i>Danh sách sinh viên</h2>
        <a th:href="@{/students/create}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm sinh viên
        </a>
    </div>

    <!-- Form tìm kiếm -->
    <form th:action="@{/students}" method="get" class="mb-4">
        <input type="hidden" name="sort" th:value="${currentSort}">
        <div class="input-group">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm kiếm theo tên hoặc email...">
            <button class="btn btn-outline-secondary" type="submit">
                <i class="bi bi-search"></i> Tìm kiếm
            </button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <!-- Trường hợp rỗng -->
            <div th:if="${#lists.isEmpty(students)}" class="text-center p-5 text-muted">
                <i class="bi bi-inbox display-4"></i>
                <p class="mt-2">Chưa có sinh viên nào.</p>
                <a th:href="@{/students/create}" class="btn btn-outline-primary">Thêm ngay</a>
            </div>

            <!-- Bảng dữ liệu -->
            <table th:unless="${#lists.isEmpty(students)}" class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>
                        <a th:href="@{/students(page=0, size=${page.size}, keyword=${keyword}, sort='id,' + (${sortField == 'id' ? reverseSortDir : 'asc'}))}"
                           class="text-white text-decoration-none">
                            ID <i th:if="${sortField == 'id'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/students(page=0, size=${page.size}, keyword=${keyword}, sort='name,' + (${sortField == 'name' ? reverseSortDir : 'asc'}))}"
                           class="text-white text-decoration-none">
                            Họ tên <i th:if="${sortField == 'name'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/students(page=0, size=${page.size}, keyword=${keyword}, sort='email,' + (${sortField == 'email' ? reverseSortDir : 'asc'}))}"
                           class="text-white text-decoration-none">
                            Email <i th:if="${sortField == 'email'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                        </a>
                    </th>
                    <th>Tuổi</th>
                    <th>Chuyên ngành</th>
                    <th>
                        <a th:href="@{/students(page=0, size=${page.size}, keyword=${keyword}, sort='gpa,' + (${sortField == 'gpa' ? reverseSortDir : 'asc'}))}"
                           class="text-white text-decoration-none">
                            GPA <i th:if="${sortField == 'gpa'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                        </a>
                    </th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student, stat : ${students}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${student.id}">1</td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           th:text="${student.name}"
                           class="text-decoration-none fw-semibold">Tên</a>
                    </td>
                    <td th:text="${student.email}">email</td>
                    <td th:text="${student.age}">20</td>
                    <td><span class="badge bg-secondary" th:text="${student.major != null ? student.major.name : ''}">CNTT</span></td>
                    <td>
                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                              (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                              th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">3.5</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           class="btn btn-sm btn-outline-info me-1" title="Chi tiết">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}"
                              method="post" class="d-inline"
                              th:data-name="${student.name}"
                              onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <nav th:if="${page.totalPages > 0}" class="mt-3">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/students(page=${page.number - 1}, size=${page.size}, keyword=${keyword}, sort=${currentSort})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                        th:classappend="${i == page.number} ? 'active'">
                        <a class="page-link" th:href="@{/students(page=${i}, size=${page.size}, keyword=${keyword}, sort=${currentSort})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/students(page=${page.number + 1}, size=${page.size}, keyword=${keyword}, sort=${currentSort})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(students)}" class="text-muted mt-2">
        <small>Tổng: <strong th:text="${page.totalElements}">0</strong> sinh viên</small>
    </div>

</section>
</body>
</html>
